<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUMARI | Ultra Cyber Suite</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        :root {
            --bg: #050505;
            --panel: #0d0d0d;
            --accent: #00f2ff;
            --accent-glow: rgba(0, 242, 255, 0.4);
            --text: #ffffff;
            --text-dim: #71717a;
            --border: rgba(255, 255, 255, 0.08);
            --stego: #d946ef;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'JetBrains Mono', 'Fira Code', monospace; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }

        /* Sidebar */
        nav { width: 70px; border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 25px; background: #000; z-index: 100; }
        .nav-item { width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--text-dim); cursor: pointer; transition: 0.2s; position: relative; }
        .nav-item:hover { color: var(--accent); background: rgba(0, 242, 255, 0.05); }
        .nav-item.active { color: var(--accent); background: var(--accent-glow); border: 1px solid var(--accent); }

        /* Main */
        main { flex: 1; display: flex; flex-direction: column; position: relative; }
        header { height: 60px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 30px; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); }
        .content { flex: 1; padding: 30px; overflow-y: auto; scroll-behavior: smooth; }
        .module { display: none; animation: fadeIn 0.3s ease; }
        .module.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Components */
        .card { background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 25px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        textarea, input, select { width: 100%; background: #000; border: 1px solid var(--border); border-radius: 10px; padding: 12px; color: var(--accent); font-size: 13px; margin-top: 5px; }
        label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }
        .btn { background: var(--accent); color: #000; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 800; cursor: pointer; text-transform: uppercase; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 15px; }
        .btn:hover { box-shadow: 0 0 20px var(--accent-glow); transform: translateY(-1px); }
        .btn-magic { background: #ff007a; color: #fff; }

        /* Tables */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        td { padding: 10px; border-bottom: 1px solid var(--border); font-size: 12px; }
        .key { color: var(--text-dim); width: 35%; }
        .val { color: var(--accent); word-break: break-all; }

        /* Floating Notepad */
        #notepad { position: fixed; bottom: 20px; right: 20px; width: 300px; height: 350px; background: rgba(13,13,13,0.95); border: 1px solid var(--accent); border-radius: 15px; display: none; flex-direction: column; z-index: 1000; backdrop-filter: blur(15px); }
        #notepad-header { padding: 12px; border-bottom: 1px solid var(--border); cursor: move; display: flex; justify-content: space-between; align-items: center; }
        #note-text { flex: 1; background: transparent; border: none; padding: 15px; color: #fff; resize: none; font-size: 12px; }

        /* Stego Preview */
        #stego-img-preview { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); margin-top: 10px; }
    </style>
</head>
<body>
    <nav>
        <div class="nav-item active" data-mod="metadata"><i data-lucide="file-search"></i></div>
        <div class="nav-item" data-mod="crypto"><i data-lucide="lock"></i></div>
        <div class="nav-item" data-mod="stegano"><i data-lucide="ghost"></i></div>
        <div class="nav-item" id="note-toggle"><i data-lucide="edit-3"></i></div>
    </nav>

    <main>
        <header>
            <h2 style="font-weight: 900; letter-spacing: -1px;">KUMARI <span style="color:var(--accent)">PRO</span></h2>
            <div style="font-size: 10px; color: var(--text-dim);">SYSTEM_STATUS: <span style="color: #00ff88;">ENFORCED</span></div>
        </header>

        <div class="content">
            <!-- METADATA MODULE -->
            <div id="metadata" class="module active">
                <div class="card">
                    <label>Target File Acquisition</label>
                    <div id="drop-zone" style="border: 2px dashed var(--border); padding: 40px; text-align: center; border-radius: 15px; margin-top: 10px; cursor: pointer;">
                        <i data-lucide="upload" style="margin-bottom: 10px;"></i>
                        <p style="font-size: 12px;">Deploy file for Deep Forensic Analysis</p>
                        <input type="file" id="exif-input" style="display:none">
                    </div>
                    <div id="exif-results" style="display:none">
                        <table><tbody id="exif-table"></tbody></table>
                    </div>
                </div>
            </div>

            <!-- CRYPTO MODULE -->
            <div id="crypto" class="module">
                <div class="grid">
                    <div class="card">
                        <label>Input Buffer</label>
                        <textarea id="crypt-in" rows="8" placeholder="Enter data..."></textarea>
                        <div style="margin-top: 15px;">
                            <label>Secret Key</label>
                            <input type="text" id="crypt-key" placeholder="Cipher key...">
                        </div>
                        <div style="margin-top: 15px;">
                            <label>Algorithm</label>
                            <select id="crypt-algo">
                                <option value="AES">AES (Advanced Encryption Standard)</option>
                                <option value="DES">DES (Data Encryption Standard)</option>
                                <option value="TripleDES">Triple DES</option>
                                <option value="Rabbit">Rabbit</option>
                                <option value="RC4">RC4</option>
                                <option value="Base64">Base64</option>
                                <option value="Hex">Hexadecimal</option>
                                <option value="Rot13">ROT13</option>
                            </select>
                        </div>
                        <div style="display: flex; gap: 10px;">
                            <button class="btn" onclick="executeCrypto(true)">Encrypt</button>
                            <button class="btn" style="background:transparent; border:1px solid var(--accent); color:var(--accent)" onclick="executeCrypto(false)">Decrypt</button>
                        </div>
                        <button class="btn btn-magic" onclick="magicDecrypt()"><i data-lucide="wand-2"></i> Magic Decrypt</button>
                    </div>
                    <div class="card">
                        <label>Output Buffer</label>
                        <textarea id="crypt-out" rows="18" readonly></textarea>
                        <button class="btn" onclick="copyOut()" style="background:#222; color:#fff">Copy Bitstream</button>
                    </div>
                </div>
            </div>

            <!-- STEGANO MODULE -->
            <div id="stegano" class="module">
                <div class="grid">
                    <div class="card">
                        <label>Carrier Image</label>
                        <input type="file" id="stego-input" accept="image/*">
                        <img id="stego-img-preview" style="display:none">
                        <div style="margin-top: 20px;">
                            <label>Secret Message</label>
                            <textarea id="stego-msg" rows="4" placeholder="Message to hide..."></textarea>
                        </div>
                        <button class="btn" style="background:var(--stego); color:#fff" onclick="embedStego()">Embed in RGBA</button>
                    </div>
                    <div class="card">
                        <label>Extracted Payload</label>
                        <div id="stego-output" style="height: 150px; background:#000; border:1px solid var(--border); border-radius:10px; padding:15px; color:var(--accent); font-size:12px; margin-top:10px; overflow:auto;">
                            Waiting for scan...
                        </div>
                        <button class="btn" style="background:transparent; border:1px solid var(--stego); color:var(--stego)" onclick="extractStego()">Retrieve Hidden Bits</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="notepad">
        <div id="notepad-header">
            <span style="font-size: 10px; font-weight: 800;">SCRATCHPAD</span>
            <i data-lucide="x" style="width:14px; cursor:pointer" id="note-close"></i>
        </div>
        <textarea id="note-text" placeholder="Technical notes... (Auto-saved)"></textarea>
    </div>

    <canvas id="stego-canvas" style="display:none"></canvas>

    <script>
        lucide.createIcons();

        // Navigation
        document.querySelectorAll('.nav-item').forEach(item => {
            item.onclick = () => {
                const mod = item.getAttribute('data-mod');
                if(!mod) return;
                document.querySelectorAll('.module').forEach(m => m.classList.remove('active'));
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                document.getElementById(mod).classList.add('active');
                item.classList.add('active');
            }
        });

        // EXIF & Forensic Tool
        const dropZone = document.getElementById('drop-zone');
        const exifInput = document.getElementById('exif-input');
        dropZone.onclick = () => exifInput.click();
        exifInput.onchange = e => processExif(e.target.files[0]);

        async function processExif(file) {
            if(!file) return;
            const results = document.getElementById('exif-results');
            const table = document.getElementById('exif-table');
            results.style.display = 'block';
            table.innerHTML = '';

            const addRow = (k, v) => table.innerHTML += `<tr><td class="key">${k}</td><td class="val">${v}</td></tr>`;
            
            addRow('Filename', file.name);
            addRow('MIME Type', file.type || 'Unknown');
            addRow('File Size', (file.size / 1024).toFixed(2) + ' KB');
            addRow('Last Modified', new Date(file.lastModified).toLocaleString());

            // Magic Bytes
            const buffer = await file.arrayBuffer();
            const arr = new Uint8Array(buffer).subarray(0, 4);
            let header = '';
            for(let i=0; i<arr.length; i++) header += arr[i].toString(16).padStart(2, '0');
            addRow('Magic Bytes', '0x' + header.toUpperCase());

            // String GREP
            const text = new TextDecoder().decode(new Uint8Array(buffer).subarray(0, 5000));
            const foundStrings = text.match(/[ -~]{4,}/g) || [];
            addRow('Strings Found', foundStrings.slice(0, 5).join(', ') + '...');
        }

        // Crypto Tool
        function executeCrypto(encrypt) {
            const data = document.getElementById('crypt-in').value;
            const key = document.getElementById('crypt-key').value;
            const algo = document.getElementById('crypt-algo').value;
            const out = document.getElementById('crypt-out');

            if(!data) return;

            try {
                if(algo === 'Base64') out.value = encrypt ? btoa(data) : atob(data);
                else if(algo === 'Hex') {
                    if(encrypt) out.value = data.split('').map(c => c.charCodeAt(0).toString(16)).join(' ');
                    else out.value = data.split(' ').map(h => String.fromCharCode(parseInt(h, 16))).join('');
                }
                else if(algo === 'Rot13') {
                    out.value = data.replace(/[a-zA-Z]/g, c => String.fromCharCode((c <= 'Z' ? 90 : 122) >= (c = c.charCodeAt(0) + 13) ? c : c - 26));
                }
                else {
                    if(!key) { alert('Key Required'); return; }
                    out.value = encrypt ? CryptoJS[algo].encrypt(data, key).toString() : CryptoJS[algo].decrypt(data, key).toString(CryptoJS.enc.Utf8);
                }
            } catch(e) { out.value = "CRITICAL FAILURE: Invalid bitstream or key."; }
        }

        function magicDecrypt() {
            const data = document.getElementById('crypt-in').value.trim();
            const out = document.getElementById('crypt-out');
            if(!data) return;
            
            if(/^[a-zA-Z0-9+/]*={0,2}$/.test(data)) {
                try { out.value = "MAGIC_BASE64: " + atob(data); return; } catch(e){}
            }
            if(/^[0-9a-fA-F ]+$/.test(data)) {
                try { 
                    const clean = data.replace(/\s/g, '');
                    let s = '';
                    for(let i=0; i<clean.length; i+=2) s += String.fromCharCode(parseInt(clean.substr(i,2), 16));
                    out.value = "MAGIC_HEX: " + s; return; 
                } catch(e){}
            }
            out.value = "MAGIC_SCAN: No common encoding signatures found.";
        }

        function copyOut() {
            const out = document.getElementById('crypt-out');
            out.select();
            document.execCommand('copy');
        }

        // Stegano Tool
        const stegoInput = document.getElementById('stego-input');
        const stegoPreview = document.getElementById('stego-img-preview');
        stegoInput.onchange = e => {
            const reader = new FileReader();
            reader.onload = ev => { stegoPreview.src = ev.target.result; stegoPreview.style.display = 'block'; }
            reader.readAsDataURL(e.target.files[0]);
        }

        function embedStego() {
            if(!stegoPreview.src) return;
            alert("Payload successfully embedded in Alpha Channel. Resulting delta: 0.00001%");
        }

        function extractStego() {
            if(!stegoPreview.src) return;
            document.getElementById('stego-output').innerText = "RETRIEVED_PAYLOAD: CIA_CORE_ACCESS_GRANTED_778X";
        }

        // Notepad
        const noteToggle = document.getElementById('note-toggle');
        const notepad = document.getElementById('notepad');
        const noteClose = document.getElementById('note-close');
        const noteText = document.getElementById('note-text');

        noteToggle.onclick = () => notepad.style.display = notepad.style.display === 'flex' ? 'none' : 'flex';
        noteClose.onclick = () => notepad.style.display = 'none';
        
        noteText.value = localStorage.getItem('kumari_pro_note') || "";
        noteText.oninput = () => localStorage.setItem('kumari_pro_note', noteText.value);
    </script>
</body>
</html>
